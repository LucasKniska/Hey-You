name: hey_you
description: "An app built for human connection."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0


# ------------------- PACKAGES ------------------------ #
dependencies:
  flutter:
    sdk: flutter


  # Bottom Sheet
  flutter_animate: ^4.5.0
  blur: ^3.1.0
  smooth_page_indicator: ^1.1.0

  # Icons
  iconsax_flutter: ^1.0.0
  cupertino_icons: ^1.0.8

  # Product Specific
  geolocator: ^14.0.0
  flutter_map: ^6.0.1
  latlong2: ^0.9.1
  geocoding: ^2.1.0
  google_maps_flutter: ^2.5.0

  # Utility Packages
  http: ^1.1.0
  intl: ^0.18.1
  logger: ^2.0.1
  url_launcher: ^6.1.12
  flutter_native_splash: ^2.4.6
  connectivity_plus: ^6.1.3

  # State Management
  get: ^4.6.5
  get_storage: ^2.1.1

  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.6
  animate_do: ^4.2.0




# ----------------------------- PACKAGES END  -------------------- #

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true


  # ------------- LOCAL ASSETS ---------- #

  assets:
    - assets/icons/
    - assets/logos/

  # ------------ LOCAL FONTS ----------------- #

